name: InvMenu compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: RyzeMP API regression scenarios
        run: php tests/run.php ryzemp
      - name: PocketMine API regression scenarios
        run: php tests/run.php pocketmine
