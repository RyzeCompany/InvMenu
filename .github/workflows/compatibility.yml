name: InvMenu compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: RyzeMP API regression scenarios
        run: php tests/run.php ryzemp
      - name: PocketMine API regression scenarios
        run: php tests/run.php pocketmine

  composer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: '8.4'
          install-path: ./bin
          pm-version-major: 5
      - name: Validate package metadata
        run: composer validate --strict
      - name: Prepare clean consumer project
        run: php tests/composer-consumer.php prepare "$RUNNER_TEMP/invmenu-consumer"
      - name: Install with real server dependency
        run: composer install --working-dir="$RUNNER_TEMP/invmenu-consumer" --no-interaction --no-progress --no-scripts
      - name: Verify autoload, replacement and server API
        run: php -d memory_limit=512M tests/composer-consumer.php verify "$RUNNER_TEMP/invmenu-consumer"
